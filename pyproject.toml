[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocaloid-integrity-check"
version = "1.0.0"
description = "Check the integrity of a Vocaloid voicebank by verifying the name digest in its .ddi index"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vocaloid-integrity-check contributors" }]
keywords = ["vocaloid", "voicebank", "ddi", "ddb", "integrity", "md5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Vsynth-Tools/vocaloid-integrity-check"
Issues = "https://github.com/Vsynth-Tools/vocaloid-integrity-check/issues"

[project.scripts]
vocaloid-integrity-check = "vocaloid_integrity_check.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
